name: Bug report
description: Report a Project RAT problem found in Revit.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: revit-version
    attributes:
      label: Revit version
      placeholder: Revit 2026
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the ribbon tool, selections, and settings used.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error message or additional details

